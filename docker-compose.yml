version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tenantease-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: tenantease
      POSTGRES_PASSWORD: tenantease_secret
      POSTGRES_DB: tenantease
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tenantease']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
